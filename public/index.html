<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Notes</h1>
        <button id="new-note-btn" type="button" title="New note">+ New</button>
      </div>
      <input id="search-input" type="text" placeholder="Search notes..." autocomplete="off" />
      <ul id="note-list"></ul>
      <p id="empty-state" class="empty-state" hidden>No notes yet.</p>
    </aside>

    <main class="editor">
      <div id="editor-empty" class="editor-empty">
        <p>Select a note, or create a new one.</p>
      </div>

      <form id="editor-form" hidden>
        <input id="title-input" type="text" placeholder="Title" autocomplete="off" required />
        <input id="tags-input" type="text" placeholder="Tags (comma separated)" autocomplete="off" />
        <textarea id="body-input" placeholder="Write something..."></textarea>
        <div class="editor-footer">
          <span id="saved-state" class="saved-state"></span>
          <button id="delete-btn" type="button" class="delete-btn">Delete</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
